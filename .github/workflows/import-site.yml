name: Import complete website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download website bundle
        run: |
          curl --fail --location 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-5860-81f4-9bd8-78d61ba8e710/raw?se=2026-09-26T08%3A59%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=fe561024-7460-4ed8-a3fd-100f0ce5dfc0&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T08%3A51%3A24Z&ske=2026-09-27T08%3A51%3A24Z&sks=b&skv=2026-02-06&sig=OXdiQrmUaMv0mz%2BrxWjOFFMgBQj08xYgnf/9un0icec%3D' --output /tmp/igorstellar-site.zip
          unzip -oq /tmp/igorstellar-site.zip -d .
      - name: Commit website
        run: |
          rm -f .github/workflows/import-site.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import complete Igor Stellar website"
          git push origin main
